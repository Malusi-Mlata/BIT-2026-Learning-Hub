<style>
:root{color-scheme:dark;--ink:#eef2fb;--dim:#9aa8c4;--line:rgba(255,255,255,.12)}

.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 14px 0;font-weight:800;font-size:13px}

#tabs button:hover{transform:scale(1.1);color:var(--ink);border-color:var(--a)}

#tabs #rb{color:#07101c;background:linear-gradient(135deg,#22c55e,#14b8a6);border:0}
main{max-width:860px;margin:0 auto;padding:150px 14px 40px}
.panel{display:none}.panel.on{display:block;animation:in .4s}

.fl:hover{transform:scale(1.1);border-color:var(--a)}

.op.ok,.in.ok{background:rgba(34,197,94,.25);border-color:#22c55e}.op.no,.in.no{background:rgba(239,68,68,.25);border-color:#ef4444}
.row{display:flex;gap:8px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:15px inherit;font-family:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a)}
textarea{min-height:110px;resize:vertical}
.go{cursor:pointer;border:0;border-radius:22px;padding:9px 20px;font:800 14px inherit;font-family:inherit;color:#07101c;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .2s;margin-top:8px}
.go:hover:not(:disabled){transform:scale(1.1)}.go:disabled{opacity:.35}
.nt{display:block;font-size:12.5px;font-style:italic;font-weight:400;color:var(--dim);margin-top:2px}.op.ok .nt{color:#bbf7d0}.op.no .nt{color:#fecaca}
.fb{display:none;margin-top:8px;padding:7px 12px;border-radius:10px;background:rgba(56,189,248,.13);font-size:14px}
.memo{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(34,197,94,.14);border:1px solid #22c55e}.memo ul{margin:4px 0 0 18px;padding:0}
.rr{display:none;margin-top:8px}.rr button{width:38px;height:34px;margin:2px;border-radius:8px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-weight:800;cursor:pointer}.rr button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#07101c;border-color:transparent}
pre.cmd{margin:6px 0;padding:12px;border-radius:10px;background:#0b0f1a;color:#d6e2ff;font:13.5px/2.1 Consolas,monospace;overflow-x:auto;white-space:pre}
pre.cmd input{display:inline-block;width:auto;padding:2px 6px;font:13.5px Consolas,monospace;background:rgba(255,255,255,.08);border-radius:6px;vertical-align:baseline}
.pn{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:26px}.pn span{color:var(--dim);font-size:13px}
.pn button{cursor:pointer;border:0;border-radius:24px;padding:11px 22px;font:800 15px inherit;font-family:inherit;color:#07101c;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .2s}
.pn button:hover:not(:disabled){transform:scale(1.1)}.pn button:disabled{opacity:.3}
.res{margin:0 0 20px;padding:20px;border-radius:18px;border:2px solid #a855f7;background:rgba(168,85,247,.12);text-align:center;display:none}
.res h2{font-size:34px;margin:0}.res table{width:100%;border-collapse:collapse;margin:10px 0;text-align:left;font-size:14px}.res td,.res th{padding:6px 8px;border-bottom:1px solid var(--line)}

const G=[['#38bdf8','#6366f1'],['#a855f7','#ec4899'],['#f97316','#eab308'],['#ef4444','#f43f5e'],['#22c55e','#14b8a6'],['#06b6d4','#3b82f6'],['#f472b6','#fb923c'],['#84cc16','#10b981']];
const SRC={T1:'Topic 1 · LAN Security (AAA, 802.1X)',T2:'Topic 2 · Network Security (TCP/UDP)',T3:'Topic 3 · Switch Security',T4:'Topic 4 · ACL Concepts',T5:'Topic 5 · ACL Configuration',T6:'Topic 6 · VPN and IPsec',T7:'Topic 7 · Network Automation (REST)',T8:'Topic 8 · Network Virtualization (SDN)'};
const MCS=[[["A router has “aaa authentication login default group radius local”. The RADIUS server is unreachable. What happens at login?","The router falls back to the local username database","Login is denied until the server responds|The router allows access without authentication|The router switches to TACACS+ automatically","Methods are tried in order; the next one is used only when the current one does not respond.","If the server answers with a reject, the login fails with no fallback.","T1"],["Which command applies the named AAA method list TELNET-LOGIN to the vty lines?","login authentication TELNET-LOGIN","aaa authentication login TELNET-LOGIN|access-class TELNET-LOGIN in|authentication list TELNET-LOGIN","The list is defined globally, then applied on the line.","Without applying it, the line keeps using the default list.","T1"],["Which difference between TACACS+ and RADIUS is correct?","TACACS+ separates authentication, authorization and accounting; RADIUS combines authentication and authorization","RADIUS encrypts the whole packet body; TACACS+ encrypts only the password|RADIUS uses TCP port 49; TACACS+ uses UDP 1812|TACACS+ is an open standard; RADIUS is Cisco proprietary","TACACS+: Cisco, TCP 49, encrypts the whole body, separate AAA.","RADIUS: open standard, UDP 1812/1813, encrypts only the password.","T1"],["In AAA accounting, “start-stop” means…","a record is sent when the service begins and again when it ends","only an end record is sent|a record is sent every minute|the session is blocked until the server answers","Start-stop records both events.","Stop-only sends just the final record.","T1"],["In 802.1X, between which two devices does EAPOL travel?","The supplicant and the authenticator","The authenticator and the authentication server|The supplicant and the authentication server|The server and the accounting server","EAP over LAN runs on the access link.","The authenticator then relays to the server with RADIUS.","T1"],["Which command makes the router ask the AAA server what a user may do after login?","aaa authorization exec default group tacacs+ local","aaa authentication login default group tacacs+ local|aaa accounting exec default start-stop group tacacs+|aaa new-model","Authorization = permissions after login.","Authentication proves who you are.","T1"]],[["For a blind TCP reset to be accepted, the spoofed RST must carry…","a sequence number inside the receiver’s current window","the correct acknowledgment number only|the server’s MAC address|a SYN and ACK flag pair","The attacker needs the right ports and an in-window sequence number.","It kills one session; the host stays up.","T2"],["Which TCP header field lets the receiver control how much unacknowledged data the sender may send?","Window size","Acknowledgment number|Urgent pointer|Checksum","Window size is the flow-control field.","A smaller window slows the sender down.","T2"],["The server replies to a SYN with sequence number x. The SYN-ACK acknowledgment number is…","x + 1","x|x − 1|y + 1 (the server’s own number)","SYN seq=x → SYN-ACK seq=y ack=x+1 → ACK ack=y+1.","The ACK number is the next byte expected.","T2"],["Which flags are set in the server’s reply, step 2 of the TCP handshake?","SYN and ACK","SYN only|ACK only|SYN and FIN","SYN-ACK acknowledges the client and opens the server side.","The client then finishes with ACK.","T2"],["Which statement about UDP is correct?","It has no handshake, sequencing or acknowledgments","It uses a three-way handshake but no sequencing|It acknowledges every datagram but cannot retransmit|It numbers segments but has no flow control","The UDP header is only 8 bytes.","Used for DNS and VoIP where speed beats reliability.","T2"],["A SYN flood uses spoofed source addresses. What happens to the server’s SYN-ACKs?","They go to the spoofed hosts, which do not complete the handshake","They return to the attacker, who answers late|They are dropped before being sent|They cause RSTs that clear the table","The entries stay half-open until they time out.","The attacker never needs the replies.","T2"],["A server shows many connections waiting for the final ACK. Which symptom does this match?","A TCP SYN flood","A TCP session hijack|A UDP flood|A TCP reset attack","Half-open connections fill the connection table.","Valid users are then refused.","T2"]],[["A sticky secure MAC address is stored in…","the running-config, and is lost on reload unless saved","the startup-config automatically|the CAM table only|NVRAM as soon as it is learned","Static = typed in. Dynamic = CAM only. Sticky = added to running-config.","Save with copy running-config startup-config.","T3"],["A port in restrict mode (maximum 2) receives frames from a third MAC. What happens?","Frames are dropped, the violation counter rises and a syslog message is sent","Frames are dropped silently with no counter|The port goes err-disabled|The maximum is raised to 3","Restrict = drop + counter + syslog, port stays up.","Protect drops silently; shutdown err-disables.","T3"],["Which command lists the secure MAC addresses and their types?","show port-security address","show port-security interface|show mac address-table dynamic|show interfaces status","The address view shows static, dynamic and sticky types.","The interface view shows counts and the violation mode.","T3"],["After a shutdown violation, what status does show port-security interface report?","Secure-shutdown","Secure-up|Secure-down|Err-forwarding","Secure-up = working. Secure-down = no device. Secure-shutdown = violated.","The port is also err-disabled.","T3"],["“switchport port-security aging time 10” with aging type inactivity does what?","Removes a secure address after it has been idle for 10 minutes","Removes every secure address 10 minutes after it was learned|Disables the port after 10 idle minutes|Sets the maximum to 10 addresses","Absolute = time since learned. Inactivity = idle time.","Aging time is in minutes.","T3"],["Which command removes the sticky addresses learned on Fa0/1?","clear port-security sticky interface fa0/1","no switchport port-security sticky|clear mac address-table dynamic|clear port-security violation","Clearing sticky entries needs the sticky keyword.","no sticky only stops further learning.","T3"]],[["An ACL has: 10 deny 192.168.1.0 0.0.0.255, then 20 permit host 192.168.1.10. A packet arrives from 192.168.1.10. What happens?","It is denied by entry 10 because processing stops at the first match","It is permitted because the more specific host entry wins|It is permitted because entry 20 is evaluated last|It is denied by the implicit deny after both entries are checked","ACLs are processed top-down and the first match wins.","Put specific entries above general ones.","T4"],["In a wildcard mask, a 0 bit means…","the matching address bit must be the same","the address bit is ignored|the address bit must be 1|the address bit is inverted","Wildcard 0 = must match, 1 = do not care.","It is the opposite of a subnet mask.","T4"],["You must insert a new entry between sequence 10 and 20 of an existing ACL. What is the correct approach?","Enter “15 permit …” in the ACL configuration mode","Retype the whole ACL in a new order|Use “insert 15” inside the ACL|Enter “access-list 110 15 permit …” in global configuration","Sequence numbers let you insert entries in the middle.","“no 20” removes entry 20.","T5"],["Which wildcard mask matches 172.16.0.0 through 172.31.255.255?","0.15.255.255","0.0.255.255|0.31.255.255|0.16.255.255","That is a /12: mask 255.240.0.0.","Wildcard = 255.255.255.255 minus the mask.","T4"],["Which ACE permits web traffic from any host to the server 10.1.1.10?","permit tcp any host 10.1.1.10 eq 80","permit tcp host 10.1.1.10 any eq 80|permit udp any host 10.1.1.10 eq 80|permit tcp any 10.1.1.10 0.0.0.255 eq 80","Format: permit protocol source destination operator port.","host means wildcard 0.0.0.0.","T5"],["Which ACE denies ICMP echo requests from any host to any destination?","deny icmp any any echo","deny icmp any any echo-reply|deny tcp any any eq echo|deny ip any any icmp","echo = request, echo-reply = response.","ICMP is its own protocol, not TCP.","T5"],["Which statement about applying ACLs is correct?","One ACL per protocol, per direction, per interface","One ACL per interface in any direction|Two ACLs per protocol in the same direction|One ACL per router for all interfaces","The 3 Ps: Protocol, Per direction, Per interface.","IPv4 and IPv6 each need their own ACL.","T4"],["In an extended ACE, which protocol keyword matches every IP packet?","ip","any|all|tcp","permit ip any any matches everything.","tcp matches only TCP.","T5"],["Which wildcard mask matches 192.168.8.0 through 192.168.11.255?","0.0.3.255","0.0.4.255|0.0.3.0|0.0.15.255","That is a /22: mask 255.255.252.0.","Wildcard = 255.255.255.255 minus the mask.","T4"]],[["Which IPsec mode encrypts the entire original IP packet and adds a new IP header?","Tunnel mode","Transport mode|Main mode|Quick mode","Tunnel mode is the usual choice for site-to-site VPNs.","Main and Quick are IKE modes, not IPsec modes.","T6"],["Which statement about a digital signature is correct?","The sender signs a hash with its private key; the receiver verifies with the public key","The sender encrypts the message with the receiver’s public key|The sender signs with the receiver’s private key|The receiver signs with the sender’s public key","Only the sender holds the private key, which gives non-repudiation.","Anyone can verify with the public key.","T6"],["IKE Phase 1 establishes…","a bidirectional ISAKMP SA that protects the Phase 2 negotiation","the IPsec SA that encrypts user data|two unidirectional SAs for user traffic|a GRE tunnel between the peers","Phase 1 = management channel. Phase 2 = data channel.","IPsec SAs are unidirectional.","T6"],["Which command applies a crypto map to an interface?","crypto map VPN-MAP (in interface configuration mode)","crypto isakmp enable VPN-MAP|ip crypto-map VPN-MAP in|crypto ipsec apply VPN-MAP","The map is applied on the outgoing interface.","The map ties ACL, transform set and peer together.","T6"],["Which set of parameters is negotiated in an ISAKMP policy (HAGLE)?","Hash, Authentication, Group, Lifetime, Encryption","Hash, Algorithm, Gateway, Lifetime, Endpoint|Header, Authentication, GRE, Length, ESP|Handshake, AES, Group, Lifetime, Encapsulation","HAGLE = Hash, Authentication, Group (DH), Lifetime, Encryption.","Both peers must match.","T6"],["Which command shows packets encapsulated and decapsulated by an IPsec tunnel?","show crypto ipsec sa","show crypto isakmp sa|show crypto map|show ip interface","ipsec sa = Phase 2 counters.","isakmp sa = Phase 1 state.","T6"],["Which IP protocol number identifies ESP?","50","51|47|500","ESP 50, AH 51, GRE 47. IKE uses UDP 500.","Number 51 belongs to AH.","T6"]],[["Which HTTP method is idempotent and replaces a resource completely?","PUT","POST|PATCH|GET","Idempotent methods: GET, PUT, DELETE. POST creates and is not idempotent.","PATCH changes part of a resource.","T7"],["Which data format shows structure with indentation and needs no braces or quotes?","YAML","JSON|XML|HTML","YAML is the easiest for people to read.","JSON uses braces and quotes; XML uses tags.","T7"],["Which status code tells the client that a new resource was created?","201","200|202|204","200 OK · 201 Created · 204 No Content · 404 Not Found.","Remember: 2xx = success.","T7"],["Which configuration management tool uses recipes and cookbooks?","Chef","Puppet|Ansible|SaltStack","Puppet = manifests. Ansible = playbooks. Salt = states.","Chef and Puppet use agents.","T7"],["Which status code means the client is not authenticated?","401","403|404|500","401 = who are you? 403 = you are not allowed.","404 = not found, 500 = server error.","T7"],["Which API type is available only to selected business partners?","Partner API","Open API|Internal API|Composite API","Open = public. Internal = private. Partner = by agreement.","Composite combines several calls.","T7"]],[["In Cisco ACI, which component is the central policy controller?","APIC","APIC-EM|DNA Center|NX-OS Fabric Manager","ACI is a spine-leaf fabric managed by the APIC.","APIC-EM and DNA Center are other Cisco controllers.","T8"],["Which statement about northbound APIs is correct?","They let applications talk to the SDN controller, usually with REST","They connect the controller to switches using OpenFlow|They carry data-plane traffic between spines and leaves|They are CLI commands on each switch","Northbound = up to applications.","Southbound = down to devices.","T8"],["Which statement about underlay and overlay is correct?","The underlay is the physical network; the overlay is a virtual network tunnelled over it","The overlay is the physical cabling; the underlay carries tenant traffic|Both are physical; the overlay adds redundancy|The underlay is controller software; the overlay is the switches","Example: VXLAN overlay tunnels over an IP underlay.","The overlay hides the physical topology from tenants.","T8"],["What is a key difference between a container and a virtual machine?","Containers share the host OS kernel; each VM runs its own guest OS","Containers need a hypervisor; VMs do not|Each container runs a full guest OS|VMs share the host kernel","Containers are lighter and start faster.","VMs need a hypervisor.","T8"],["Which plane carries management traffic such as SSH, SNMP and Syslog?","The management plane","The control plane|The data plane|The forwarding plane","Control = routing decisions. Data = forwarding. Management = configure and monitor.","Controllers sit on the control plane.","T8"]]];

{n:'🔐 AAA',mn:'A-A-A = Who are you? What can you do? What did you do?',ow:[['AAA component that logs what a user did?','Accounting','Accounting = who, what and when.','T1'],['AAA component that verifies who the user is?','Authentication','Authentication proves identity before access.','T1'],['Cisco AAA protocol that runs over TCP port 49?','TACACS+|TACACS','TACACS+ separates authentication, authorization and accounting.','T1'],['Open-standard AAA protocol that uses UDP 1812 and 1813?','RADIUS','RADIUS encrypts only the password.','T1'],['In 802.1X, the client device is the ___.','supplicant','Client = supplicant; switch or AP = authenticator.','T1'],['Command that switches AAA on: aaa ___-model','new','aaa new-model comes before other AAA commands.','T1'],['Authentication method that uses usernames stored on the device itself?','local','Local AAA does not scale; use it as the backup.','T1']]},
{n:'📡 TCP & UDP',mn:'SYN flood = half-open pile-up · RST = reset · hijack = predict the SEQ.',ow:[['TCP flag that opens a connection?','SYN','Handshake: SYN, SYN-ACK, ACK.','T2'],['Attack that leaves many half-open TCP connections?','SYN flood|flood','The final ACK never arrives, so entries pile up.','T2'],['TCP flag that aborts a connection at once?','RST','A spoofed RST is the basis of a reset attack.','T2'],['Connectionless transport protocol (3 letters)?','UDP','No handshake, no sequencing, no acknowledgments.','T2'],['Size in bytes of the UDP header?','8|eight','Source, destination, length and checksum: 2 bytes each.','T2'],['TCP field that controls flow: ___ size.','window','A smaller window slows the sender.','T2'],['Well-known port number for HTTPS?','443','HTTP is 80, HTTPS is 443.','T2']]},
{n:'🔌 Port Security',mn:'S-R-P: Shutdown (strict) → Restrict → Protect (silent).',ow:[['Default violation mode?','shutdown','The port goes err-disabled and sends a syslog message.','T3'],['Least secure violation mode?','protect','Drops silently: no counter, no syslog.','T3'],['Violation mode that drops frames and logs but keeps the port up?','restrict','Restrict = drop + counter + syslog.','T3'],['Command that turns an unused port off?','shutdown','Shut down every unused port.','T3'],['Learning method that saves MACs in the running-config?','sticky','Save the config or sticky MACs are lost on reload.','T3'],['After a shutdown violation the port is err-___.','disabled|err-disabled','Recover with shutdown, then no shutdown.','T3'],['Default maximum number of secure MACs on a port?','1|one','Change it with port-security maximum.','T3'],['Mode needed first: switchport mode ___','access','Port security needs a manually set access or trunk port.','T3']]},
{n:'🚧 ACLs',mn:'Standard = near Destination · Extended = near Source (SD-ES).',ow:[['Keyword that replaces the wildcard 0.0.0.0?','host','host 10.1.1.5 = 10.1.1.5 0.0.0.0.','T4'],['Keyword that replaces 255.255.255.255 as the wildcard?','any','any matches every address.','T4'],['ACL type that filters on source address only?','standard','Standard goes near the destination.','T4'],['ACL type that filters on source, destination and ports?','extended','Extended goes near the source.','T4'],['Hidden last entry of every ACL: implicit ___','deny','Add a permit or everything is dropped.','T4'],['Command that applies an ACL to vty lines: ___-class','access','access-class is for vty; access-group is for interfaces.','T5'],['Wildcard mask for a /24 network?','0.0.0.255','Wildcard = 255.255.255.255 minus the subnet mask.','T4'],['Command that applies an ACL to an interface: ip access-___','group','ip access-group NAME in or out.','T5'],['Show command that lists all ACLs: show ___-lists','access','It shows entries and match counters.','T5']]},
{n:'🛡️ IPsec',mn:'ESP = Encrypts + Signs · AH = Authenticates only.',ow:[['IPsec protocol that encrypts and authenticates (3 letters)?','ESP','ESP is IP protocol 50.','T6'],['IPsec protocol that only authenticates (2 letters)?','AH','AH is IP protocol 51; no encryption.','T6'],['Algorithm that agrees a shared secret over an insecure channel?','DH|Diffie-Hellman|DiffieHellman','The key is never sent across the wire.','T6'],['Hash with a 128-bit digest?','MD5','SHA-1 is 160-bit, SHA-256 is 256-bit.','T6'],['Recommended symmetric encryption algorithm (3 letters)?','AES','AES keys: 128, 192 or 256 bits.','T6'],['Authentication method where the key is typed on each peer (3 letters)?','PSK','Certificates scale better than PSK.','T6'],['Protocol that negotiates IPsec security associations (3 letters)?','IKE','Phase 1 builds the ISAKMP SA, Phase 2 the IPsec SAs.','T6'],['IPsec mode that protects the whole original IP packet?','tunnel','Tunnel mode is normal for site-to-site VPNs.','T6']]},
{n:'🔗 REST',mn:'CRUD = POST, GET, PUT, DELETE.',ow:[['HTTP verb for Create?','POST','POST create, GET read, PUT/PATCH update, DELETE delete.','T7'],['HTTP verb for Read?','GET','GET is safe and idempotent.','T7'],['HTTP verb for Delete?','DELETE','Repeating a DELETE leaves the same end state.','T7'],['Data format that uses indentation instead of braces (4 letters)?','YAML','Used for Ansible playbooks.','T7'],['HTTP status code for Not Found?','404','401 = not authenticated, 403 = not allowed.','T7'],['Data format with braces and key/value pairs (4 letters)?','JSON','JSON arrays use square brackets.','T7'],['App commonly used to build and test API requests?','Postman','Python and developer sites also work.','T7']]},
{n:'☁️ SDN',mn:'Control plane = Brain · Data plane = Muscle.',ow:[['The brain of a network device (___ plane)?','control','Control plane decides; data plane forwards.','T8'],['The plane that forwards traffic?','data','Also called the forwarding plane.','T8'],['API between the controller and applications (___bound)?','north|northbound','Northbound = applications, usually REST.','T8'],['Southbound protocol often used in SDN (8 letters)?','OpenFlow','Southbound = controller to devices.','T8'],['SDN table used to rate-limit traffic?','meter','Flow, group and meter tables.','T8'],['Controller of Cisco ACI (4 letters)?','APIC','ACI is a spine-leaf fabric managed by the APIC.','T8'],['Software that creates and runs virtual machines?','hypervisor','Type 1 = bare metal, Type 2 = on a host OS.','T8'],['Traffic between servers inside a data centre is ___-West.','East','North-South leaves the data centre.','T8']]}];
D.forEach((t,i)=>t.mc=MCS[i]);
const esc=t=>t.replace(/</g,'&lt;');
const nz=s=>s.toLowerCase().replace(/[\s.]/g,'');
const tabs=document.getElementById('tabs'),m=document.getElementById('m'),res=document.getElementById('res'),$=id=>document.getElementById(id);let cur=0;const S=[];
D.forEach((t,ti)=>{const [a,b]=G[ti],bt=document.createElement('button');bt.style.cssText='--a:'+a+';--b:'+b;bt.innerHTML=t.n+' <span id="tc'+ti+'"></span>';bt.onclick=()=>go(ti);tabs.appendChild(bt);const p=document.createElement('section');p.className='panel';m.appendChild(p);build(ti)});
tabs.insertAdjacentHTML('beforeend','<button id="rb">📊 Results</button>');$('rb').onclick=()=>results();
function setS(ti,id,pts){S[ti].it[id]=pts;upd()}
function flipCard(front,notes,src){const c=document.createElement('div');c.className='fc';
c.innerHTML='<div class="face front">'+front+'<button class="fl">🔄 Flip for notes</button></div><div class="face back"><h4>🔑 Key takeaways</h4><ul>'+notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul><div class="src">📖 '+SRC[src]+'</div><button class="fl">↩ Back to question</button></div>';
c.querySelectorAll('.fl').forEach(b=>b.onclick=()=>c.classList.toggle('flip'));return c}
function build(ti){const t=D[ti],[a,b]=G[ti],tot=t.mc.length+t.ow.length,p=m.children[ti],was=p.classList.contains('on');S[ti]={it:{},tot};
p.className='panel'+(was?' on':'');p.style.cssText='--a:'+a+';--b:'+b;
p.innerHTML='<div class="ph"><h2>'+t.n+'</h2><div class="sc" id="sc'+ti+'">0 / '+tot+'</div></div><div class="mn">🧠 '+t.mn+' · Tap 🔄 on any card for notes.</div>';
const sec=x=>{const d=document.createElement('div');d.className='sec';d.textContent=x;p.appendChild(d)};
sec('Multiple choice · '+t.mc.length+' marks (click once, no changes)');
t.mc.forEach((q,i)=>{const o=q[2].split('|'),pos=(i*3+ti)%4;o.splice(pos,0,q[1]);
const c=flipCard('<div class="tg"><span>1 mark</span></div><p><small>A'+(i+1)+'</small>'+esc(q[0])+'</p>'+o.map((x,k)=>'<button class="op">'+'ABCD'[k]+'. '+esc(x)+'</button>').join('')+'<div class="fb"></div>',[q[3],q[4]],q[5]);
c.querySelectorAll('.op').forEach((bn,k)=>bn.onclick=()=>{if(c.dataset.d)return;c.dataset.d=1;const ok=k==pos;setS(ti,'m'+i,ok?1:0);const f=c.querySelector('.fb');f.style.display='block';f.textContent=(ok?'✅ +1 · ':'❌ ')+q[3];
c.querySelectorAll('.op').forEach((x,j)=>{x.disabled=true;if(j==pos){x.classList.add('ok');x.insertAdjacentHTML('beforeend','<span class="nt">✔ '+esc(q[3])+'</span>')}else if(j==k){x.classList.add('no');x.insertAdjacentHTML('beforeend','<span class="nt">✘ Not this one</span>')}})});p.appendChild(c)});
sec('One word · '+t.ow.length+' marks (type, then Check or Enter)');
t.ow.forEach((q,i)=>{const c=flipCard('<div class="tg"><span>1 mark</span></div><p><small>B'+(i+1)+'</small>'+esc(q[0])+'</p><div class="row"><input class="in" placeholder="One word…"><button class="go" style="margin-top:0">Check</button></div><div class="fb"></div>',[q[2],t.mn],q[3]);
const inp=c.querySelector('input'),bn=c.querySelector('.go');
const chk=()=>{if(c.dataset.d||!inp.value.trim())return;c.dataset.d=1;const ok=q[1].split('|').some(x=>nz(x)==nz(inp.value));setS(ti,'w'+i,ok?1:0);const f=c.querySelector('.fb');f.style.display='block';f.innerHTML=(ok?'✅ +1':'❌ <b>'+esc(q[1].split('|')[0])+'</b>')+' · '+esc(q[2]);inp.readOnly=true;inp.classList.add(ok?'ok':'no');bn.disabled=true};
bn.onclick=chk;inp.onkeydown=e=>{if(e.key=='Enter')chk()};p.appendChild(c)});
p.insertAdjacentHTML('beforeend','<div class="pn"><button class="bk">◀ Back</button><button class="rt">🔁 Retry tab</button><span>'+(ti+1)+' / '+D.length+'</span><button class="nx">Next ▶</button></div>');
p.querySelector('.bk').onclick=()=>go(cur-1);p.querySelector('.nx').onclick=()=>go(cur+1);p.querySelector('.rt').onclick=()=>{build(ti);upd();window.scrollTo({top:0})};
if(!ti)p.querySelector('.bk').disabled=true;if(ti==D.length-1)p.querySelector('.nx').disabled=true;upd()}
function sums(){let o=0,d=0,mo=0,wo=0;const per=S.map(s=>{let so=0,sd=0;Object.entries(s.it).forEach(([id,v])=>{so+=v;sd++;if(id[0]=='m')mo+=v;else wo+=v});o+=so;d+=sd;return{o:so,d:sd,tot:s.tot}});return{o,d,mo,wo,per}}
function upd(){const r=sums();r.per.forEach((x,k)=>{const e=$('tc'+k);if(e){e.textContent=x.d+'/'+x.tot;$('sc'+k).textContent=x.o+' / '+x.tot}});
$('tot').textContent=r.o+' / 100 · '+r.o+'%';$('p0').textContent='MCQ '+r.mo+'/46';$('p1').textContent='One word '+r.wo+'/54';$('pb').style.width=r.d+'%';pad()}
function pad(){$('mn').style.paddingTop=($('top').offsetHeight+14)+'px'}
function results(){const r=sums(),w=r.per.map((x,i)=>({n:D[i].n,r:x.o/x.tot})).sort((a,b)=>a.r-b.r);
res.style.display='block';res.innerHTML='<h2>'+(r.o>=75?'🏆':r.o>=50?'👍':'💪')+' '+r.o+' / 100 ('+r.o+'%)</h2><p>MCQ <b>'+r.mo+'/46</b> · One word <b>'+r.wo+'/54</b> · Answered '+r.d+'/100</p><table><tr><th>Topic</th><th>Marks</th></tr>'+r.per.map((x,i)=>'<tr><td>'+D[i].n+'</td><td style="color:'+(x.o/x.tot>=.75?'#4ade80':x.o/x.tot>=.5?'#facc15':'#f87171')+'">'+x.o+' / '+x.tot+'</td></tr>').join('')+'</table><p>🎯 Revise first: <b>'+w[0].n+'</b> and <b>'+w[1].n+'</b></p><button class="go" style="--a:#a855f7;--b:#ec4899" onclick="document.getElementById(\'res\').style.display=\'none\'">Close</button> <button class="go" style="--a:#22c55e;--b:#14b8a6" onclick="location.reload()">🔁 Retry everything</button>';pad();window.scrollTo({top:0,behavior:'smooth'})}
function go(i){if(i<0||i>=D.length)return;cur=i;[...tabs.children].forEach((b,j)=>b.classList.toggle('on',j==i));[...m.children].forEach((p,j)=>p.classList.toggle('on',j==i));tabs.children[i].scrollIntoView({inline:'center',block:'nearest'});window.scrollTo({top:0,behavior:'smooth'})}
let TL=0,TI=null;
function tick(){TL--;const x=Math.max(TL,0);$('tm').textContent=String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');$('tm').className=TL<=600?'red':'';if(TL<=0){clearInterval(TI)}}
function start(){if(TI)return;TL=+$('dur').value*60+1;$('dur').disabled=true;$('st').disabled=true;tick();TI=setInterval(tick,1000)}
window.addEventListener('resize',pad);upd();go(0);

</script></body></html>

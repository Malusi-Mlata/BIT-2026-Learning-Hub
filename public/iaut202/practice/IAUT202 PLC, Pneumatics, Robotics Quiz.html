function stepSVG(seq,cyl){var n=seq.length,W=58,X=34,H=36,h=cyl.length*H+34,s="<svg viewBox='0 0 "+(X+W*n+8)+" "+h+"' width='100%' style='max-width:620px'>";

  var Y=function(v){return v?y1:y0},d="M"+X+","+Y(st);
  seq.forEach(function(m,k){var xa=X+k*W,xb=xa+W;if(m[0]==c){var nv=m[1]=="+"?1:0;d+=" L"+xa+","+Y(st)+" L"+xa+","+Y(nv)+" L"+xb+","+Y(nv);st=nv}else d+=" L"+xb+","+Y(st)});

lg("Why use both NO and NC pushbuttons?",3,"NO is open until pressed, so pressing completes the circuit: START. NC is closed until pressed, so pressing breaks it: STOP. NC for STOP is fail-safe: a broken wire or lost power stops the machine.","PLC basics","NO = GO, NC = STOP."),

lg("What are interlocks and why are they used in industry?",3,"A safety mechanism where components allow or disallow a process unless strict rules are met. Used for safety and equipment protection, e.g. a guard door must be closed before a press runs; forward and reverse contactors cannot be on together.","Ch 5 · Interlocks"),
lg("Differentiate an ON-delay timer from an OFF-delay timer, with examples.",4,"ON-delay: the output switches on only after the input has been on for the preset time, e.g. an alarm rings 5 seconds after a button press. OFF-delay: the output stays on for the preset time after the input switches off, e.g. a cooling fan runs 30 seconds after the machine stops. Timers count time; counters count pulses.","PLC basics","ON-delay waits BEFORE on. OFF-delay waits AFTER off."),

 function up(){var r=v[0]*8+v[1]*4+v[2]*2+v[3],o=or?(r>0?1:0):(r==15?1:0);
  root.querySelectorAll('.tg').forEach(function(b,i){b.textContent="ABCD"[i]+" = "+v[i];b.classList.toggle('hi',!!v[i])});

 root.innerHTML="<div class='sw'><label>Preset (boxes) <select class='pvs'><option>3</option><option selected>5</option><option>8</option><option>12</option></select></label><button class='bt pls'>Box passes the sensor (+1)</button><button class='bt r rst'>Reset</button></div><div class='bx'></div><div class='out'><b class='cv'></b><span class='lp'><i class='lamp lm'></i>Conveyor motor</span><span class='lp'><i class='lamp ld'></i>DONE bit</span></div>";
 function up(){var d=acc>=pv,h="";for(var i=0;i<pv;i++)h+="<i class='bxs"+(i<acc?" f":"")+"'></i>";
  root.querySelector('.bx').innerHTML=h;root.querySelector('.cv').textContent="ACC "+acc+" / PRE "+pv;cl(root,'.lm',!d);cl(root,'.ld',d)}
 root.addEventListener('click',function(e){var c=e.target.classList;if(c.contains('pls')){if(acc<99)acc++}else if(c.contains('rst'))acc=0;up()});

function timer(root,off){var inn=0,q=0,t=0,pt=30,H={i:[],q:[]};
 root.innerHTML="<div class='sw'><button class='bt tg'></button><label>Preset <select><option value='20'>2 s</option><option value='30' selected>3 s</option><option value='50'>5 s</option></select></label></div><div class='out'><span class='lp'><i class='lamp li'></i>Input</span><span class='lp'><i class='lamp lq'></i>Output Q</span><b class='tv'></b></div><div class='tl'></div>";
 function draw(){cl(root,'.li',inn);cl(root,'.lq',q);root.querySelector('.tv').textContent="Timer "+(t/10).toFixed(1)+" / "+(pt/10)+" s";
  var b=root.querySelector('.tg');b.textContent="Input "+(inn?"ON":"OFF")+" (tap to switch)";b.classList.toggle('hi',!!inn);tl(root.querySelector('.tl'),[H.i,H.q],['var(--b)','var(--ok)'],['IN','Q'])}
 function tick(){if(!off){if(inn){if(t<pt)t++;q=t>=pt?1:0}else{t=0;q=0}}else{if(inn){q=1;t=0}else if(q){t++;if(t>=pt){q=0;t=0}}}
  H.i.push(inn);H.q.push(q);if(H.i.length>100){H.i.shift();H.q.shift()}draw()}
 root.addEventListener('click',function(e){if(e.target.classList.contains('tg')){inn^=1;draw()}});
 root.addEventListener('change',function(e){pt=+e.target.value;t=0});
 SIM.t.push(tick);draw()}
function latch(root){var st=0,sp=0,q=0;
 root.innerHTML="<div class='sw'><button class='bt g hold' data-k='s'>Hold START</button><button class='bt r hold' data-k='p'>Hold STOP</button></div><div class='rung'></div><div class='out'><span class='lp'><i class='lamp lm'></i>Motor Q</span><b class='lt'></b></div>";
 function scan(){q=((st||q)&&!sp)?1:0;var c=function(t,on){return "<span class='ct"+(on?" on":"")+"'>"+t+"</span>"};
  root.querySelector('.rung').innerHTML=c("START (NO)"+(st?" pressed":""),st)+" OR "+c("Q seal-in (NO)",q)+" AND "+c("STOP (NC)"+(sp?" pressed":" closed"),!sp)+" gives "+c("Motor Q",q);
  cl(root,'.lm',q);root.querySelector('.lt').textContent=q?(st?"Running (START held)":"Running: Q is holding itself on"):"Stopped"}
 function set(b,v){if(b.dataset.k=="s")st=v;else sp=v;scan()}
 ["pointerdown"].forEach(function(n){root.addEventListener(n,function(e){var b=e.target.closest('.hold');if(b)set(b,1)})});
 ["pointerup","pointerleave","pointercancel"].forEach(function(n){root.addEventListener(n,function(e){var b=e.target.closest&&e.target.closest('.hold');if(b)set(b,0)},true)});
 root.addEventListener('click',function(e){var b=e.target.closest('.hold');if(b&&e.detail===0){set(b,1);setTimeout(function(){set(b,0)},300)}});scan()}
function interlock(root){var f=0,r=0,on=1,m="";
 root.innerHTML="<div class='sw'><button class='bt g' data-k='f'>FORWARD</button><button class='bt g' data-k='r'>REVERSE</button><button class='bt r' data-k='s'>STOP</button><button class='bt tg' data-k='i'></button></div><div class='out'><span class='lp'><i class='lamp lf'></i>Forward contactor</span><span class='lp'><i class='lamp lr'></i>Reverse contactor</span></div><div class='warn'></div>";
 function up(){cl(root,'.lf',f);cl(root,'.lr',r);var b=root.querySelector('.tg');b.textContent="Interlock "+(on?"ON":"OFF");b.classList.toggle('hi',!!on);
  root.querySelector('.warn').textContent=f&&r?"DANGER: both contactors are on. Short circuit!":m}
 root.addEventListener('click',function(e){var k=e.target.dataset.k;if(!k)return;m="";
  if(k=="f"){if(on&&r)m="Blocked by the interlock. Press STOP first.";else f=1}
  else if(k=="r"){if(on&&f)m="Blocked by the interlock. Press STOP first.";else r=1}
  else if(k=="s")f=r=0;else on^=1;up()});up()}
var SIMS=[
["Up-Counter (CTU)","Press the button each time a box passes the sensor. The count goes up. When it reaches the preset, DONE turns on and the conveyor stops.","An up counter counts input pulses upward from zero. When the count reaches the preset value, its done bit turns on. Example: count 12 boxes, then stop the conveyor.",counter],
["On-Delay timer (TON)","Switch the input ON and watch the timer. The output turns on only after the preset time. Switch the input off early and the timer resets.","An on-delay timer switches its output ON only after the input has been on for the preset time. Example: an alarm rings 5 seconds after the button is pressed.",function(r){timer(r,0)}],
["Off-Delay timer (TOF)","Switch the input ON and the output comes on at once. Switch the input OFF and the output stays on until the preset time is over.","An off-delay timer keeps its output on for the preset time after the input switches off. Example: a cooling fan runs 30 seconds after the machine stops.",function(r){timer(r,1)}],
["OR gate (4 inputs)","Switch the inputs and watch the output. The current row of the truth table lights up.","An OR gate outputs 1 when at least one input is 1. It outputs 0 only when all inputs are 0. A 4-input truth table has 16 rows.",function(r){gate(r,1)}],
["AND gate (4 inputs)","Same inputs, different rule. Try to make the output 1.","An AND gate outputs 1 only when all four inputs are 1. That is one row out of 16.",function(r){gate(r,0)}],
["Latching circuit (seal-in)","Hold START, then let go. The motor stays on. Hold STOP to break the latch.","A latching circuit keeps the output on after the START button is released. The output own contact in parallel with START holds it on (seal-in). A normally closed STOP in series breaks it.",latch],
["Interlock (forward and reverse)","Press FORWARD, then REVERSE. The interlock blocks the second one. Switch the interlock OFF to see why it matters.","An interlock allows or stops a process unless strict rules are met. Here forward and reverse can never be on together, which protects the motor and the wiring.",interlock]];
